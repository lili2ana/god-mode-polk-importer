name: Test sales recovery gates
on:
  pull_request:
    paths:
      - '*.py'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'importer_parts/**'
      - 'requirements-test.txt'
      - '.github/workflows/test-sales-recovery.yml'
      - '.github/workflows/load-sales.yml'
  push:
    branches: ['codex/sales-recovery']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POLK_TEST_DB_URL: postgresql://postgres:disposable-ci-only@localhost:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
