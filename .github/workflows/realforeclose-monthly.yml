name: Polk RealForeclose Monthly Ingest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scrape_realforeclose_month.py'
      - '.github/workflows/realforeclose-monthly.yml'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright psycopg2-binary
          python -m playwright install --with-deps chromium
      - name: Require correct Supabase project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing"; exit 2; }
          case "$SUPABASE_DB_URL" in
            *bnsmnztxkqmphvbikaxh*) ;;
            *) echo "Refusing to run: wrong Supabase project"; exit 3 ;;
          esac
      - name: Ingest monthly foreclosure calendar and cases
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python -u scrape_realforeclose_month.py 2>&1 | tee realforeclose_month.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realforeclose-month-${{ github.run_id }}
          path: |
            realforeclose_month.log
            realforeclose_month_probe.json
          retention-days: 30
          if-no-files-found: warn
