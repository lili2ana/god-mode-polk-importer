name: Charlotte elevation adapter tests
on:
  pull_request:
    paths:
      - charlotte_elevation_certificates.py
      - tests/test_charlotte_elevation_certificates.py
      - .github/workflows/charlotte-elevation-tests.yml
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated adapter tests (no writes or outreach)
        run: python -m unittest discover -s tests -p test_charlotte_elevation_certificates.py -v
