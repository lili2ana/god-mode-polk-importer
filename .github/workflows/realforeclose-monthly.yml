name: Polk RealForeclose Monthly Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'
  push:
    branches: [main]
    paths:
      - 'scrape_realforeclose_month.py'
      - '.github/workflows/realforeclose-monthly.yml'

jobs:
  ingest:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install playwright psycopg2-binary
          python -m playwright install chromium

      - name: Require correct Supabase project
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_DB_URL)) {
            throw 'SUPABASE_DB_URL secret is missing'
          }
          if ($env:SUPABASE_DB_URL -notmatch 'bnsmnztxkqmphvbikaxh') {
            throw 'Refusing to run: wrong Supabase project'
          }

      - name: Ingest monthly foreclosure calendar and cases
        shell: pwsh
        timeout-minutes: 20
        run: |
          python -u scrape_realforeclose_month.py 2>&1 | Tee-Object -FilePath realforeclose_month.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realforeclose-month-${{ github.run_id }}
          path: |
            realforeclose_month.log
            realforeclose_month_probe.json
          retention-days: 30
          if-no-files-found: warn
