name: Polk Legal Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legal-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Install database client
        run: pip install psycopg2-binary

      - name: Download, validate, reconcile, and orphan-check hardened legal parser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from ftplib import FTP_TLS
          from pathlib import Path
          import csv, io, json, zipfile, collections, os, psycopg2

          host='ftp.polkflpa.gov'
          remote='/AppraisalData/ftp_legal.zip'
          zpath=Path('ftp_legal.zip')
          ftp=FTP_TLS(host, timeout=120); ftp.login(); ftp.prot_p()
          with zpath.open('wb') as f:
              ftp.retrbinary(f'RETR {remote}', f.write, blocksize=1024*1024)
          ftp.quit()
          assert zipfile.is_zipfile(zpath)

          with zipfile.ZipFile(zpath) as zf:
              member=next(i for i in zf.infolist() if not i.is_dir())
              raw_bytes=zf.read(member)

          text=raw_bytes.decode('utf-8', errors='replace')
          physical=text.splitlines()
          header=[v.strip('"') for v in physical[0].split(',',7)]
          expected=['PARCEL_ID','NUM','SECTION','TOWNSHIP','RANGE','SUB','PARCEL','DSCR']
          assert header == expected, (header, expected)

          legacy_reader=csv.reader(io.StringIO(text, newline=''), delimiter=',')
          next(legacy_reader)
          legacy_widths=collections.Counter()
          legacy_rows=0
          legacy_keys=set()
          for row in legacy_reader:
              legacy_rows += 1
              legacy_widths[len(row)] += 1
              if len(row) >= 2 and row[0].strip().isdigit() and row[1].strip().isdigit():
                  legacy_keys.add((row[0].strip(), row[1].strip()))

          normalized_rows=0
          structural_failures=[]
          hardened_keys=set()
          parcel_seen=set()
          dscr_quote_rows=0
          for line_no,line in enumerate(physical[1:], start=2):
              parts=line.split(',',7)
              if len(parts) != 8:
                  structural_failures.append((line_no,len(parts),line[:500]))
                  continue
              structural=[v.strip('"') for v in parts[:7]]
              dscr=parts[7]
              pid,num,section,township,rng,sub,parcel=structural
              if not (pid.isdigit() and num.isdigit() and section.isdigit() and township.isdigit()
                      and rng.isdigit() and sub.isdigit() and parcel.isdigit()):
                  structural_failures.append((line_no,'noncoded',structural))
                  continue
              normalized_rows += 1
              parcel_seen.add(pid)
              hardened_keys.add((pid,num))
              inner=dscr[1:-1] if len(dscr)>=2 else dscr
              if '"' in inner:
                  dscr_quote_rows += 1

          recovered_keys=sorted(hardened_keys - legacy_keys)
          legacy_only_keys=sorted(legacy_keys - hardened_keys)

          conn=psycopg2.connect(os.environ['SUPABASE_DB_URL'])
          try:
              with conn.cursor() as cur:
                  cur.execute('CREATE TEMP TABLE legal_hardened_parcels(parcel_id text PRIMARY KEY) ON COMMIT DROP')
                  buf=io.StringIO(''.join(pid+'\n' for pid in sorted(parcel_seen)))
                  cur.copy_from(buf,'legal_hardened_parcels',columns=('parcel_id',))
                  cur.execute('SELECT count(*) FROM legal_hardened_parcels l JOIN polk_parcel_v2 p USING(parcel_id)')
                  matched=cur.fetchone()[0]
                  cur.execute('SELECT count(*) FROM legal_hardened_parcels l LEFT JOIN polk_parcel_v2 p USING(parcel_id) WHERE p.parcel_id IS NULL')
                  orphans=cur.fetchone()[0]
              conn.rollback()
          finally:
              conn.close()

          summary={
              'physical_data_lines':len(physical)-1,
              'legacy_csv_logical_rows':legacy_rows,
              'row_count_delta':(len(physical)-1)-legacy_rows,
              'legacy_field_count_distribution':dict(sorted(legacy_widths.items())),
              'hardened_normalized_rows':normalized_rows,
              'structural_failures':len(structural_failures),
              'unique_hardened_keys':len(hardened_keys),
              'unique_legacy_keys':len(legacy_keys),
              'recovered_distinct_keys_count':len(recovered_keys),
              'recovered_distinct_keys':recovered_keys,
              'legacy_only_keys_count':len(legacy_only_keys),
              'legacy_only_keys':legacy_only_keys,
              'unique_parcel_ids':len(parcel_seen),
              'matched_unique_parcel_ids_post_hardening':matched,
              'orphan_unique_parcel_ids_post_hardening':orphans,
              'rows_with_quote_inside_dscr_tail':dscr_quote_rows,
          }
          Path('legal_parser_reconciliation.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))

          assert len(structural_failures) == 0
          assert normalized_rows == 1074337
          assert len(hardened_keys) == 1074337
          assert len(recovered_keys) == 46
          assert len(legacy_only_keys) == 0
          assert matched == 438628
          assert orphans == 0
          PY

      - name: Upload parser reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: legal-parser-reconciliation-${{ github.run_id }}
          retention-days: 30
          path: legal_parser_reconciliation.json

      - name: Retain raw source briefly while feed is diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: legal-raw-source-${{ github.run_id }}
          retention-days: 3
          compression-level: 0
          path: ftp_legal.zip
