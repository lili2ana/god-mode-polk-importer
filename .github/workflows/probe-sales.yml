name: Probe Polk Sales Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'probe_polk_sales.py'
      - '.github/workflows/probe-sales.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe official Polk sales feed
        shell: bash
        run: |
          set -euo pipefail
          python probe_polk_sales.py | tee sales_probe.log

      - name: Upload sales probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polk-sales-probe-${{ github.run_id }}
          path: sales_probe.log
          retention-days: 30
          if-no-files-found: warn
