name: Polk Legal Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legal-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Download and validate hardened legal parser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from ftplib import FTP_TLS
          from pathlib import Path
          import csv, io, json, zipfile, collections, re

          host='ftp.polkflpa.gov'
          remote='/AppraisalData/ftp_legal.zip'
          zpath=Path('ftp_legal.zip')
          ftp=FTP_TLS(host, timeout=120); ftp.login(); ftp.prot_p()
          with zpath.open('wb') as f:
              ftp.retrbinary(f'RETR {remote}', f.write, blocksize=1024*1024)
          ftp.quit()
          assert zipfile.is_zipfile(zpath)

          with zipfile.ZipFile(zpath) as zf:
              member=next(i for i in zf.infolist() if not i.is_dir())
              raw_bytes=zf.read(member)

          text=raw_bytes.decode('utf-8', errors='replace')
          physical=text.splitlines()
          header=physical[0].split(',',7)
          header=[v.strip('"') for v in header]
          expected=['PARCEL_ID','NUM','SECTION','TOWNSHIP','RANGE','SUB','PARCEL','DSCR']
          assert header == expected, (header, expected)

          # Legacy standards-based CSV view, retained only to quantify the source defect.
          legacy_reader=csv.reader(io.StringIO(text, newline=''), delimiter=',')
          next(legacy_reader)
          legacy_widths=collections.Counter()
          legacy_rows=0
          legacy_bad=[]
          for row in legacy_reader:
              legacy_rows += 1
              legacy_widths[len(row)] += 1
              if len(row) != 8:
                  legacy_bad.append(row)

          # Hardened parser: first seven commas delimit seven coded structural fields;
          # the entire remaining physical-line tail is DSCR and is never CSV-reparsed.
          normalized_rows=0
          structural_failures=[]
          composite_seen=set()
          composite_dups=0
          parcel_seen=set()
          dscr_quote_rows=0
          max_legacy_width=0
          max_legacy_sample=None

          for line_no,line in enumerate(physical[1:], start=2):
              parts=line.split(',',7)
              if len(parts) != 8:
                  structural_failures.append((line_no,len(parts),line[:500]))
                  continue
              structural=[v.strip('"') for v in parts[:7]]
              dscr=parts[7]
              if len(structural) != 7 or any(',' in v for v in structural):
                  structural_failures.append((line_no,'structural',structural))
                  continue
              pid,num,section,township,rng,sub,parcel=structural
              # Fail closed on the structural boundary. These seven columns are coded data,
              # never survey prose; if they stop looking coded, the assumption is broken.
              if not (pid.isdigit() and num.isdigit() and section.isdigit() and township.isdigit()
                      and rng.isdigit() and sub.isdigit() and parcel.isdigit()):
                  structural_failures.append((line_no,'noncoded',structural))
                  continue
              normalized_rows += 1
              parcel_seen.add(pid)
              key=(pid,num)
              if key in composite_seen:
                  composite_dups += 1
              else:
                  composite_seen.add(key)
              if '"' in dscr[1:-1] if len(dscr)>=2 else '"' in dscr:
                  dscr_quote_rows += 1

              # Canary: independently parse this physical line with csv.reader and remember
              # the single most extreme field explosion; verify our structural fields survive.
              legacy=next(csv.reader([line], delimiter=','))
              if len(legacy) > max_legacy_width:
                  max_legacy_width=len(legacy)
                  max_legacy_sample={
                      'line_no':line_no,
                      'legacy_width':len(legacy),
                      'structural':structural,
                      'dscr_tail':dscr[:1000],
                      'legacy_fields':legacy[:30],
                  }

          summary={
              'zip_bytes':zpath.stat().st_size,
              'uncompressed_bytes':len(raw_bytes),
              'physical_lines_including_header':len(physical),
              'physical_data_lines':len(physical)-1,
              'legacy_csv_logical_rows':legacy_rows,
              'legacy_bad_records':len(legacy_bad),
              'legacy_field_count_distribution':dict(sorted(legacy_widths.items())),
              'hardened_normalized_rows':normalized_rows,
              'structural_failures':len(structural_failures),
              'duplicate_composite_keys':composite_dups,
              'unique_parcel_ids':len(parcel_seen),
              'rows_with_quote_inside_dscr_tail':dscr_quote_rows,
              'max_legacy_width':max_legacy_width,
              'max_legacy_sample':max_legacy_sample,
              'first_structural_failures':structural_failures[:20],
          }
          Path('legal_parser_validation.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(summary,indent=2,ensure_ascii=False))

          assert len(structural_failures) == 0, structural_failures[:5]
          assert normalized_rows == len(physical)-1
          assert composite_dups == 0
          assert len(parcel_seen) == 438628
          assert max_legacy_width >= 22
          PY

      - name: Upload parser validation
        uses: actions/upload-artifact@v4
        with:
          name: legal-parser-validation-${{ github.run_id }}
          retention-days: 30
          path: legal_parser_validation.json

      - name: Retain raw source briefly while feed is diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: legal-raw-source-${{ github.run_id }}
          retention-days: 3
          compression-level: 0
          path: ftp_legal.zip
