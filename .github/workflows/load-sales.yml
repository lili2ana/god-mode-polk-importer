name: Validate Polk Sales Archive
on:
  workflow_dispatch:
    inputs:
      expected_rows:
        type: string
        default: '3031366'
        description: Row count of accepted source snapshot
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg2-binary==2.9.11
      - name: Validate archive without database credentials
        env:
          EXPECTED_ROWS: ${{ inputs.expected_rows }}
        run: python load_sales_snapshot.py --expected-rows "$EXPECTED_ROWS" --manifest-output sales_manifest.json
      - name: Upload aggregate evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: polk-sales-validation-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: sales_manifest.json
