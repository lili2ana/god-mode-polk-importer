name: Probe Official Records LP
on:
  push:
    branches: [main]
    paths:
      - 'probe_official_records_lp.py'
      - 'persist_official_records_lp.py'
      - '.github/workflows/probe-official-records-lp.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Postgres driver
        run: |
          pip install playwright psycopg2-binary
          python -m playwright install --with-deps chromium
      - name: Require Supabase secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing"; exit 2; }
          case "$SUPABASE_DB_URL" in
            *bnsmnztxkqmphvbikaxh*) ;;
            *) echo "Refusing to run: wrong Supabase project"; exit 3 ;;
          esac
      - name: Run Official Records LP probe
        shell: bash
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -x
          set -euo pipefail
          python -u probe_official_records_lp.py 2>&1 | tee official_records_lp_probe.log
      - name: Persist verified structured LP records
        shell: bash
        run: |
          set -euo pipefail
          python -u persist_official_records_lp.py | tee official_records_lp_persist.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-records-lp-${{ github.run_id }}
          path: |
            official_records_lp_probe.log
            official_records_lp_persist.log
            official_records_lp_probe.json
            official_records_results.png
          retention-days: 30
          if-no-files-found: warn
