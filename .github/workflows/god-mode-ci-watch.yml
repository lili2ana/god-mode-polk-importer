name: God Mode CI Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: god-mode-ci-watch
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'lili2ana/god-mode-polk-importer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install database driver
        run: python -m pip install 'psycopg2-binary>=2.9,<3'

      - name: Verify change detection tests
        run: python -m unittest discover -s tests -p 'test_monitor.py' -v

      - name: Restore latest durable monitor snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=god-mode-ci-watch-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/watch-state.zip"
            unzip -oq "$RUNNER_TEMP/watch-state.zip" -d state
            test -s state/monitor-state.json
            echo 'Restored last verified monitoring snapshot.'
          else
            echo 'No snapshot artifact exists; creating a silent baseline.'
          fi

      - name: Install optional staging CA certificate
        env:
          SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          value = os.getenv('SUPABASE_DB_CA_CERT', '').strip()
          if value:
              path = Path(os.environ['RUNNER_TEMP']) / 'staging-monitor-ca.pem'
              path.write_text(value + '\n')
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('PGSSLROOTCERT=' + str(path) + '\n')
          PY

      - name: Monitor read-only Supabase and GitHub
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          GH_MONITOR_TOKEN: ${{ github.token }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_KIND: ${{ vars.ALERT_WEBHOOK_KIND }}
          MONITOR_STATE_FILE: state/monitor-state.json
        run: python monitor.py

      - name: Save verified snapshot for next execution
        uses: actions/upload-artifact@v4
        with:
          name: god-mode-ci-watch-state
          path: state/monitor-state.json
          if-no-files-found: error
          retention-days: 7

      - name: Check smoke attempt history
        id: smoke_gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=god-mode-webhook-smoke-v1-attempt&per_page=100" --jq '.artifacts | length' | awk '{s+=$1} END {print s+0}')
          if [[ "$count" == 0 ]]; then
            printf 'TEST ONLY attempt claimed; delivery not yet verified\n' > smoke-attempt.txt
            echo 'send=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Existing attempt claim; no automatic resend.'
          fi

      - name: Persist smoke attempt claim
        if: steps.smoke_gate.outputs.send == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: god-mode-webhook-smoke-v1-attempt
          path: smoke-attempt.txt
          if-no-files-found: error
          retention-days: 90

      - name: Deliver controlled Slack smoke test
        if: steps.smoke_gate.outputs.send == 'true'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_KIND: ${{ vars.ALERT_WEBHOOK_KIND }}
        run: |
          python - <<'PY'
          import monitor
          from pathlib import Path
          try:
              url = monitor.require("ALERT_WEBHOOK_URL")
              monitor.webhook_smoke(url, monitor.webhook_kind(url))
          except Exception:
              raise SystemExit("Smoke delivery unverified; do not automatically retry.")
          Path("smoke-receipt.txt").write_text("Slack webhook HTTP success; TEST ONLY\n")
          print("Controlled Slack smoke test delivered.")
          PY

      - name: Record smoke delivery receipt
        if: steps.smoke_gate.outputs.send == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: god-mode-webhook-smoke-v1
          path: smoke-receipt.txt
          if-no-files-found: error
          retention-days: 90
