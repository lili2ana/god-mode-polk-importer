name: Polk RealForeclose Monthly Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'
  push:
    branches: [main]
    paths:
      - 'scrape_realforeclose_month.py'
      - '.github/workflows/realforeclose-monthly.yml'

jobs:
  ingest:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUNBUFFERED: '1'
      PYTHON_EXE: 'C:\Users\admin\AppData\Local\Programs\Python\Python311\python.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python 3.11
        shell: powershell
        run: |
          if (-not (Test-Path $env:PYTHON_EXE)) {
            throw "Verified Python path is not accessible to runner service: $env:PYTHON_EXE"
          }
          Write-Host "Using Python: $env:PYTHON_EXE"
          & $env:PYTHON_EXE --version
          & $env:PYTHON_EXE -m pip --version

      - name: Install dependencies
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          & $env:PYTHON_EXE -m pip install playwright psycopg2-binary
          & $env:PYTHON_EXE -m playwright install chromium

      - name: Require correct Supabase project
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_DB_URL)) {
            throw 'SUPABASE_DB_URL secret is missing'
          }
          if ($env:SUPABASE_DB_URL -notmatch 'bnsmnztxkqmphvbikaxh') {
            throw 'Refusing to run: wrong Supabase project'
          }

      - name: Ingest monthly foreclosure calendar and cases
        shell: powershell
        timeout-minutes: 20
        run: |
          & $env:PYTHON_EXE -u scrape_realforeclose_month.py 2>&1 | Tee-Object -FilePath realforeclose_month.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realforeclose-month-${{ github.run_id }}
          path: |
            realforeclose_month.log
            realforeclose_month_probe.json
          retention-days: 30
          if-no-files-found: warn
