name: Polk Bulk Import

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Safe operation to run"
        required: true
        default: "owner"
        type: choice
        options:
          - verify-only
          - owner
          - parcel
          - legal
          - dry-run-owner
          - full
      partitions:
        description: "Stable-hash shard count"
        required: true
        default: "32"
        type: string
  push:
    branches: [main]

concurrency:
  group: polk-bulk-import-production
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      POLK_IMPORT_WORKDIR: ${{ github.workspace }}/.polk_import
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble importer
        shell: bash
        run: |
          set -euo pipefail
          cat importer_parts/part*.py > polk_importer.py
          python -m py_compile polk_importer.py
          test -s polk_importer.py
          echo "Importer assembled: $(wc -l < polk_importer.py) lines"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require Supabase secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing"; exit 2; }
          case "$SUPABASE_DB_URL" in
            *bnsmnztxkqmphvbikaxh*) ;;
            *) echo "Refusing to run: SUPABASE_DB_URL does not identify project bnsmnztxkqmphvbikaxh"; exit 3 ;;
          esac

      - name: Probe official Polk parcel feed schema
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[probe-parcel]') }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee parcel_probe.log
          from ftplib import FTP_TLS
          from pathlib import Path
          import csv, io, zipfile

          host = 'ftp.polkflpa.gov'
          remote = '/AppraisalData/ftp_parcel.zip'
          out = Path('ftp_parcel.zip')

          ftp = FTP_TLS(host, timeout=120)
          ftp.login()
          ftp.prot_p()
          size = ftp.size(remote)
          print(f'FTPS host={host}')
          print(f'remote={remote}')
          print(f'remote_size={size}')
          with out.open('wb') as f:
              ftp.retrbinary(f'RETR {remote}', f.write, blocksize=1024*1024)
          ftp.quit()
          print(f'downloaded_size={out.stat().st_size}')
          print(f'zip_valid={zipfile.is_zipfile(out)}')
          if not zipfile.is_zipfile(out):
              raise SystemExit('parcel feed is not a valid ZIP')

          with zipfile.ZipFile(out) as zf:
              data_members = [i for i in zf.infolist() if not i.is_dir()]
              if not data_members:
                  raise SystemExit('ZIP contains no data file')
              member = data_members[0]
              print('zip_member=', member.filename)
              print('uncompressed_size=', member.file_size)
              with zf.open(member) as raw:
                  text = io.TextIOWrapper(raw, encoding='utf-8', errors='replace', newline='')
                  reader = csv.reader(text, delimiter=',')
                  header = next(reader)
                  print('column_count=', len(header))
                  print('header_fields=', header)
                  parcel_idx = header.index('PARCEL_ID')
                  strap_idx = header.index('PR_STRAP')
                  row_count = 0
                  bad_width = 0
                  parcel_seen = set()
                  parcel_dups = 0
                  blank_parcel = 0
                  strap_nonblank = 0
                  strap_seen = set()
                  strap_dups = 0
                  samples = []
                  for row in reader:
                      row_count += 1
                      if len(row) != len(header):
                          bad_width += 1
                          continue
                      if len(samples) < 3:
                          samples.append(row)
                      pid = row[parcel_idx].strip()
                      if not pid:
                          blank_parcel += 1
                      elif pid in parcel_seen:
                          parcel_dups += 1
                      else:
                          parcel_seen.add(pid)
                      strap = row[strap_idx].strip()
                      if strap:
                          strap_nonblank += 1
                          if strap in strap_seen:
                              strap_dups += 1
                          else:
                              strap_seen.add(strap)

          print('csv_data_rows=', row_count)
          print('bad_width_rows=', bad_width)
          print('unique_parcel_ids=', len(parcel_seen))
          print('duplicate_parcel_id_rows=', parcel_dups)
          print('blank_parcel_id_rows=', blank_parcel)
          print('pr_strap_nonblank_rows=', strap_nonblank)
          print('unique_pr_strap=', len(strap_seen))
          print('duplicate_pr_strap_rows=', strap_dups)
          for i, row in enumerate(samples, 1):
              print(f'sample_row_{i}=', row)

          if len(header) != 36:
              raise SystemExit(f'schema drift: expected 36 columns, got {len(header)}')
          if bad_width:
              raise SystemExit(f'schema drift: {bad_width} rows do not have 36 columns')
          if blank_parcel:
              raise SystemExit(f'key failure: {blank_parcel} rows have blank PARCEL_ID')
          PY

      - name: Probe official Polk legal feed schema and parcel coverage
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[probe-legal]') }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee legal_probe.log
          from ftplib import FTP_TLS
          from pathlib import Path
          import csv, io, os, zipfile, psycopg2

          host = 'ftp.polkflpa.gov'
          remote = '/AppraisalData/ftp_legal.zip'
          out = Path('ftp_legal.zip')

          ftp = FTP_TLS(host, timeout=120)
          ftp.login()
          ftp.prot_p()
          size = ftp.size(remote)
          print(f'FTPS host={host}')
          print(f'remote={remote}')
          print(f'remote_size={size}')
          with out.open('wb') as f:
              ftp.retrbinary(f'RETR {remote}', f.write, blocksize=1024*1024)
          ftp.quit()
          print(f'downloaded_size={out.stat().st_size}')
          print(f'zip_valid={zipfile.is_zipfile(out)}')
          if not zipfile.is_zipfile(out):
              raise SystemExit('legal feed is not a valid ZIP')

          with zipfile.ZipFile(out) as zf:
              data_members = [i for i in zf.infolist() if not i.is_dir()]
              if not data_members:
                  raise SystemExit('ZIP contains no data file')
              member = data_members[0]
              print('zip_member=', member.filename)
              print('uncompressed_size=', member.file_size)
              with zf.open(member) as raw:
                  text = io.TextIOWrapper(raw, encoding='utf-8', errors='replace', newline='')
                  reader = csv.reader(text, delimiter=',')
                  header = next(reader)
                  print('column_count=', len(header))
                  print('header_fields=', header)
                  parcel_idx = header.index('PARCEL_ID')
                  num_idx = header.index('NUM') if 'NUM' in header else None
                  strap_idx = header.index('PR_STRAP') if 'PR_STRAP' in header else None
                  row_count = 0
                  bad_width = 0
                  blank_parcel = 0
                  parcel_seen = set()
                  composite_seen = set()
                  composite_dups = 0
                  strap_nonblank = 0
                  strap_seen = set()
                  samples = []
                  for row in reader:
                      row_count += 1
                      if len(row) != len(header):
                          bad_width += 1
                          continue
                      if len(samples) < 3:
                          samples.append(row)
                      pid = row[parcel_idx].strip()
                      if not pid:
                          blank_parcel += 1
                      else:
                          parcel_seen.add(pid)
                      if num_idx is not None:
                          key = (pid, row[num_idx].strip())
                          if key in composite_seen:
                              composite_dups += 1
                          else:
                              composite_seen.add(key)
                      if strap_idx is not None:
                          strap = row[strap_idx].strip()
                          if strap:
                              strap_nonblank += 1
                              strap_seen.add(strap)

          print('csv_data_rows=', row_count)
          print('bad_width_rows=', bad_width)
          print('blank_parcel_id_rows=', blank_parcel)
          print('unique_parcel_ids=', len(parcel_seen))
          print('duplicate_composite_key_rows=', composite_dups)
          print('pr_strap_present=', strap_idx is not None)
          print('pr_strap_nonblank_rows=', strap_nonblank)
          print('unique_pr_strap=', len(strap_seen))
          for i, row in enumerate(samples, 1):
              print(f'sample_row_{i}=', row)

          # Compare legal parcel universe to the verified parcel table using a session-temp table only.
          conn = psycopg2.connect(os.environ['SUPABASE_DB_URL'])
          try:
              with conn.cursor() as cur:
                  cur.execute('CREATE TEMP TABLE legal_probe_parcel_ids (parcel_id text PRIMARY KEY) ON COMMIT DROP')
                  buf = io.StringIO(''.join(f'{pid}\n' for pid in sorted(parcel_seen)))
                  cur.copy_from(buf, 'legal_probe_parcel_ids', columns=('parcel_id',))
                  cur.execute('SELECT count(*) FROM legal_probe_parcel_ids l LEFT JOIN polk_parcel_v2 p USING (parcel_id) WHERE p.parcel_id IS NULL')
                  orphan_count = cur.fetchone()[0]
                  cur.execute('SELECT count(*) FROM legal_probe_parcel_ids l JOIN polk_parcel_v2 p USING (parcel_id)')
                  matched_count = cur.fetchone()[0]
              conn.rollback()
          finally:
              conn.close()
          print('matched_unique_legal_parcel_ids=', matched_count)
          print('orphan_unique_legal_parcel_ids=', orphan_count)

          if bad_width:
              raise SystemExit(f'schema drift: {bad_width} rows do not match header width')
          if blank_parcel:
              raise SystemExit(f'key failure: {blank_parcel} legal rows have blank PARCEL_ID')
          if composite_dups:
              raise SystemExit(f'key failure: {composite_dups} duplicate (PARCEL_ID, NUM) rows')
          PY

      - name: Preflight database identity and counts
        shell: bash
        run: |
          set -euo pipefail
          python polk_importer.py --verify-only | tee preflight.log

      - name: Verify only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'verify-only' }}
        run: echo "Verification-only run complete."

      - name: Dry-run owner
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'dry-run-owner' }}
        shell: bash
        run: |
          set -euo pipefail
          python polk_importer.py --only owner --partitions "${{ inputs.partitions }}" --dry-run | tee importer.log

      - name: Import owner
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'owner') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-owner]')) }}
        shell: bash
        run: |
          set -euo pipefail
          python polk_importer.py --only owner --partitions "${{ github.event_name == 'workflow_dispatch' && inputs.partitions || '32' }}" | tee importer.log

      - name: Import parcel
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'parcel') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-parcel]')) }}
        shell: bash
        run: |
          set -euo pipefail
          python polk_importer.py --only parcel --partitions "${{ github.event_name == 'workflow_dispatch' && inputs.partitions || '32' }}" | tee importer.log

      - name: Import legal
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'legal') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-legal]')) }}
        shell: bash
        run: |
          set -euo pipefail
          python polk_importer.py --only legal --partitions "${{ github.event_name == 'workflow_dispatch' && inputs.partitions || '32' }}" | tee importer.log

      - name: Full sequence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Full sequence will still fail closed while any feed mapping_verified=False."
          python polk_importer.py --partitions "${{ inputs.partitions }}" | tee importer.log

      - name: Postflight database counts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python polk_importer.py --verify-only | tee postflight.log

      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: polk-import-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            preflight.log
            importer.log
            postflight.log
            parcel_probe.log
            legal_probe.log
            .polk_import/verified/*.verified
