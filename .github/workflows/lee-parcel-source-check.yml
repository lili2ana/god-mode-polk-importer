name: Lee parcel source validation (read only)
on:
  pull_request:
    paths:
      - 'scripts/lee_parcel_source_check.py'
      - '.github/workflows/lee-parcel-source-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare Lee parcel services (no writes)
        run: python scripts/lee_parcel_source_check.py
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-parcel-comparison
          path: lee-parcel-comparison.json
          if-no-files-found: warn
